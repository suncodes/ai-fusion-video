name: Publish Docker Images

on:
  push:
    branches:
      - '**'      # 任意分支提交后触发构建
    tags:
      - '[0-9]*'   # 匹配 0.2.0、1.0.0、1.0.0-alpha 等版本标签
      - 'v[0-9]*'  # 匹配 v1.0.0、v1.0.0-alpha 等版本标签

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: suncodes
  BACKEND_IMAGE_NAME: ai-fusion-video
  FRONTEND_IMAGE_NAME: ai-fusion-video-web
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ai-fusion-video/pom.xml

      - name: Build backend JAR
        working-directory: ./ai-fusion-video
        run: |
          chmod +x mvnw
          ./mvnw package -DskipTests -B

      - name: Prepare backend Docker context
        working-directory: ./ai-fusion-video
        run: |
          JAR_PATH=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)
          if [ -z "$JAR_PATH" ]; then
            echo "No packaged backend jar found"
            exit 1
          fi
          mkdir -p docker-build
          cp "$JAR_PATH" docker-build/app.jar

      # tag 发布使用版本号；分支提交使用 branch-shortsha，避免分支名包含 / 时生成非法 Docker tag。
      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^-+//; s/-+$//')
            VERSION="${SAFE_REF}-${GITHUB_SHA::7}"
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve image names
        id: images
        run: |
          echo "backend=${REGISTRY}/${IMAGE_NAMESPACE}/${BACKEND_IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "frontend=${REGISTRY}/${IMAGE_NAMESPACE}/${FRONTEND_IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Resolve image tags
        id: image_tags
        shell: bash
        run: |
          BACKEND_IMAGE="${{ steps.images.outputs.backend }}"
          FRONTEND_IMAGE="${{ steps.images.outputs.frontend }}"

          {
            echo "backend<<EOF"
            echo "${BACKEND_IMAGE}:${{ steps.version.outputs.VERSION }}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "${BACKEND_IMAGE}:latest"
            fi
            echo "EOF"

            echo "frontend<<EOF"
            echo "${FRONTEND_IMAGE}:${{ steps.version.outputs.VERSION }}"
            if [ "${GITHUB_REF_TYPE}" = "tag" ] || [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
              echo "${FRONTEND_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------- 后端 ----------
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./ai-fusion-video/docker-build
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.image_tags.outputs.backend }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---------- 前端 ----------
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./ai-fusion-video-web
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.image_tags.outputs.frontend }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
